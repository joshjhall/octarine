# cargo-deny configuration (v0.19+)
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# ─── Advisories ──────────────────────────────────────────────────────────────

[advisories]
ignore = [
  # rsa crate has a known timing side-channel with no patch available.
  # Transitive dep only — we don't use RSA directly for signing or verification.
  # Re-evaluate by 2026-10-01: check if upstream has patched or if we can drop the dep.
  # CRITICAL: if RS256 server-side signing is ever added, this MUST be resolved first.
  { id = "RUSTSEC-2023-0071", reason = "no patch available, transitive dep only — re-evaluate 2026-10-01" },
  # atomic-polyfill is unmaintained (not a vulnerability). Pulled in transitively
  # via phonenumber → postcard → heapless 0.7. postcard requires heapless ^0.7,
  # and heapless only dropped atomic-polyfill (for portable-atomic) in 0.8+, so we
  # cannot upgrade it away without an upstream postcard bump.
  # Re-evaluate by 2026-12-01: check if phonenumber/postcard moved to heapless 0.8+.
  { id = "RUSTSEC-2023-0089", reason = "unmaintained, transitive via phonenumber→postcard→heapless 0.7 — re-evaluate 2026-12-01" },
]

# ─── Bans ────────────────────────────────────────────────────────────────────

[bans]
# multiple-versions stays "warn" so a genuinely-NEW duplicate (one we could
# actually fix) still surfaces in CI logs instead of failing the build.
#
# Every entry below is a duplicate we investigated and confirmed UNFIXABLE
# today: each old version is pulled only by transitive crates that are already
# at their latest crates.io *stable* release, so no intermediate bump on our
# side eliminates it. The fix in every case is upstream shipping a new major.
# We deliberately do NOT adopt pre-release blockers (dashmap 7.0.0-rc, ssh-key
# 0.7.0-rc) to clear these. Skips list the exact OLD version so a future THIRD
# version still warns. Grouped by the upstream blocker that must move first;
# re-evaluate all on 2026-12-01.
#
# Verified via `cargo tree -i <crate>@<old>` + crates.io latest-stable check.
multiple-versions = "warn"
skip = [
  # ── thiserror 1.x ── blockers: forwarded-header-value 0.1.1 (via
  # tower_governor 0.8.0), graphql-parser 0.4.1. Both latest; no thiserror-2.x.
  { crate = "thiserror:1.0.69", reason = "forwarded-header-value + graphql-parser (both latest) still on thiserror 1.x — re-evaluate 2026-12-01" },
  { crate = "thiserror-impl:1.0.69", reason = "travels with thiserror 1.x — re-evaluate 2026-12-01" },

  # ── RustCrypto 0.10/0.4-era cluster ── blockers (all latest stable):
  # jsonwebtoken 10.4.0, totp-rs 5.7.2, ssh-key 0.6.7, argon2 0.5.3, sqlx 0.9.0,
  # bs58 0.5.1, curve25519-dalek 4.1.3, rsa 0.9.x. None yet on digest 0.11 /
  # cipher 0.5 / rand 0.9. ssh-key 0.7 (cipher/inout/crypto-common) is -rc only.
  { crate = "block-buffer:0.10.4", reason = "RustCrypto digest-0.10 cluster (jsonwebtoken/ssh-key/totp-rs/argon2, all latest) — re-evaluate 2026-12-01" },
  { crate = "cipher:0.4.4", reason = "ssh-cipher 0.2 ← ssh-key 0.6.7 (0.7 is -rc only) — re-evaluate 2026-12-01" },
  { crate = "const-oid:0.9.6", reason = "der 0.7 / digest 0.10 via jsonwebtoken (p256/p384/rsa/ed25519) — re-evaluate 2026-12-01" },
  { crate = "constant_time_eq:0.3.1", reason = "totp-rs 5.7.2 (latest) — re-evaluate 2026-12-01" },
  { crate = "cpufeatures:0.2.17", reason = "argon2/curve25519-dalek/sha1-0.10/sha2-0.10, all latest — re-evaluate 2026-12-01" },
  { crate = "crypto-common:0.1.6", reason = "cipher 0.4 + digest 0.10 (RustCrypto cluster) — re-evaluate 2026-12-01" },
  { crate = "digest:0.10.7", reason = "broad RustCrypto digest-0.10 fan-in (all leaves latest) — re-evaluate 2026-12-01" },
  { crate = "hkdf:0.12.4", reason = "elliptic-curve 0.13 via jsonwebtoken p256/p384 — re-evaluate 2026-12-01" },
  { crate = "hmac:0.12.1", reason = "hkdf 0.12 / jsonwebtoken / rfc6979 / totp-rs, all latest — re-evaluate 2026-12-01" },
  { crate = "inout:0.1.4", reason = "cipher 0.4 ← ssh-key 0.6.7 — re-evaluate 2026-12-01" },
  { crate = "sha1:0.10.7", reason = "totp-rs 5.7.2 (latest) still on sha1 0.10 — re-evaluate 2026-12-01" },
  { crate = "sha2:0.10.9", reason = "wide RustCrypto-0.10 fan-in incl. sqlx 0.9.0 / ssh-key / jsonwebtoken, all latest — re-evaluate 2026-12-01" },

  # ── RustCrypto rand/getrandom split ── blockers: jsonwebtoken 10.4.0,
  # rsa 0.9.x (num-bigint-dig), governor 0.10.4, opentelemetry_sdk 0.32.1.
  { crate = "getrandom:0.2.17", reason = "jsonwebtoken 10.4.0 + rand_core 0.6 (RustCrypto) — re-evaluate 2026-12-01" },
  { crate = "getrandom:0.3.4", reason = "governor 0.10.4 / rand 0.9.5 / opentelemetry_sdk 0.32.1, all latest — re-evaluate 2026-12-01" },
  { crate = "rand:0.8.7", reason = "jsonwebtoken 10.4.0 + rsa 0.9 (num-bigint-dig), all latest — re-evaluate 2026-12-01" },
  { crate = "rand:0.9.5", reason = "atomic-write-file/governor/opentelemetry_sdk, all latest — re-evaluate 2026-12-01" },
  { crate = "rand_chacha:0.3.1", reason = "follows rand 0.8 — re-evaluate 2026-12-01" },
  { crate = "rand_core:0.6.4", reason = "RustCrypto rand_core-0.6 ecosystem (elliptic-curve/rsa/signature) — re-evaluate 2026-12-01" },
  { crate = "rand_core:0.9.5", reason = "follows rand 0.9.5 blockers — re-evaluate 2026-12-01" },

  # ── toml / figment stack ── single blocker: figment 0.10.19 (latest) pins
  # toml ^0.8, which drags toml_edit 0.22 + winnow 0.7 + toml_datetime 0.6.
  { crate = "toml_datetime:0.6.11", reason = "figment 0.10.19 pins toml 0.8 — re-evaluate 2026-12-01" },
  { crate = "toml_edit:0.22.27", reason = "figment 0.10.19 pins toml 0.8 — re-evaluate 2026-12-01" },
  { crate = "winnow:0.7.15", reason = "toml_edit 0.22 ← figment 0.10.19 — re-evaluate 2026-12-01" },

  # ── singletons ── each a single upstream blocker at latest stable.
  { crate = "darling:0.20.11", reason = "derive_builder 0.20.2 / neli 0.7.4 / zxcvbn 3.1.1, all latest — re-evaluate 2026-12-01" },
  { crate = "darling_core:0.20.11", reason = "travels with darling 0.20 — re-evaluate 2026-12-01" },
  { crate = "darling_macro:0.20.11", reason = "travels with darling 0.20 — re-evaluate 2026-12-01" },
  { crate = "hashbrown:0.14.5", reason = "dashmap 6.2.1 ← governor (dashmap 7 is -rc only) — re-evaluate 2026-12-01" },
  { crate = "hashbrown:0.16.1", reason = "hashlink 0.11 / sqlx / governor, all latest — re-evaluate 2026-12-01" },
  { crate = "nix:0.30.1", reason = "atomic-write-file 0.3.0 (latest) pins nix ^0.30 — re-evaluate 2026-12-01" },
  { crate = "r-efi:5.3.0", reason = "getrandom 0.3.4 ← governor/rand 0.9/opentelemetry_sdk — re-evaluate 2026-12-01" },
  { crate = "regex-syntax:0.6.29", reason = "regex-cache 0.2.1 ← phonenumber 0.3.10, both latest — re-evaluate 2026-12-01" },
  { crate = "sha3:0.11.0", reason = "ml-kem 0.3.2 (latest) pins sha3 0.11 — re-evaluate 2026-12-01" },
  { crate = "tower-http:0.6.11", reason = "reqwest 0.13.4 (latest) pins tower-http ^0.6 — re-evaluate 2026-12-01" },
  # Only 0.59.0 vs 0.61.2 duplicate on the Linux deny host; 0.52.0 is a
  # Windows-only transitive not in the Linux graph, so no skip needed for it.
  { crate = "windows-sys:0.59.0", reason = "fd-lock 4.0.4 (latest) still on windows-sys 0.59 — re-evaluate 2026-12-01" },
]

# ─── Licenses ────────────────────────────────────────────────────────────────

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-1-Clause",
  "0BSD",
  "ISC",
  "Unlicense",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

exceptions = [
  # r-efi is dual-licensed MIT/Apache-2.0/LGPL-2.1+; we use it under MIT/Apache-2.0
  { allow = ["LGPL-2.1-or-later"], crate = "r-efi" },
]

# ─── Sources ─────────────────────────────────────────────────────────────────

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
